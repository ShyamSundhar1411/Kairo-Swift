# XcodeGen spec — generates Kairo.xcodeproj with the iOS and watchOS targets,
# both linking the local KairoKit package.
#
#   brew install xcodegen
#   cd mobile && ./generate.sh && open Kairo.xcodeproj
#
# Use generate.sh rather than xcodegen directly: signing is per-developer and
# comes from mobile/signing.env, and an unset variable would otherwise be written
# into the project literally.
#
# Info.plist and the entitlements file are GENERATED from this spec, so every
# key lives here. Editing ios/KairoApp/Resources/Info.plist by hand — or letting
# Xcode edit it through the capabilities editor — is overwritten on the next
# `xcodegen generate`. That is how the HealthKit and camera usage strings were
# lost once already.
name: Kairo
options:
  bundleIdPrefix: au.edu.sydney.elec5620.kairo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  # The on-device domain now sits alongside the apps rather than in a shared
  # top-level directory: the agent layer moved to the Python backend, so nothing
  # outside mobile/ links this package any more.
  Kairo:
    path: KairoKit

targets:
  KairoApp:
    type: application
    platform: iOS
    sources:
      - path: ios/KairoApp
    dependencies:
      - package: Kairo
        product: KairoKit
      - target: KairoWatch
    # The UI tests run inside this scheme, so `xcodebuild test -scheme KairoApp`
    # exercises the screens. They exist because this machine has no Simulator.app
    # — there is no window to click — and the screens that matter most here are
    # two taps deep.
    scheme:
      testTargets:
        - KairoUITests
    info:
      path: ios/KairoApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kairo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Where a fresh install looks for the backend, before anybody has typed
        # anything. Loopback by default, which is right in the simulator and
        # wrong on a phone — set KAIRO_BACKEND_URL in mobile/signing.env to your
        # Mac's LAN address and regenerate, and a device build points at it with
        # nothing entered on the device. A stored address still wins, so this
        # only ever supplies the first value.
        KairoDefaultBackendURL: ${KAIRO_BACKEND_URL}
        # Bonjour, so the phone can find the backend instead of being told an
        # address that changes with the network. Both keys are required on
        # iOS 14+: without NSBonjourServices the browser returns nothing and
        # reports no error, which is the worst way for a feature to be absent.
        NSBonjourServices:
          - _kairo._tcp
        NSLocalNetworkUsageDescription: >-
          Kairo looks for your own agent backend on this network, so you do not have
          to type its address. It only looks for Kairo, and nothing about you is sent
          while it looks.
        # The screen iOS paints before any code runs. Kairo.canvas and the
        # generated mark, so KairoStartup can open on the same picture and the
        # handover is invisible. Assets come from scripts/make-brand-assets.swift.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

        # Every string below is shown to the user in a permission dialog. Say what
        # the data is used for, in the user's words, not the system's.
        NSHealthShareUsageDescription: >-
          Kairo reads your sleep, movement and heart data so it can tell you when you
          are actually short on rest — and stay quiet when it cannot see enough to say
          anything useful. This data stays on your iPhone.
        NSHealthUpdateUsageDescription: >-
          Kairo writes the water and mindful minutes you log here back to Health so
          your other apps stay in sync.
        NSCameraUsageDescription: >-
          Kairo uses the camera to log a meal from one photo. Photos are analysed on
          your iPhone; they are only uploaded if you agree, per meal.
        NSPhotoLibraryUsageDescription: >-
          Kairo can read a meal photo you have already taken instead of asking you to
          take a new one.
        NSUserNotificationsUsageDescription: >-
          Kairo sends at most a handful of reminders a day, and only when it thinks
          you will actually act on one. You can lower that number or turn it off
          entirely.

        # Development only: the agent server runs on localhost during Stage 2.
        # Remove this before any real distribution.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: ios/KairoApp/Resources/KairoApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        # com.apple.developer.healthkit.access is deliberately absent. That key is
        # HealthKit Access (Verifiable Health Records) — clinical records over
        # FHIR — which a personal Apple ID cannot be granted, so requesting it
        # fails every device build with a provisioning error. Kairo does not read
        # clinical records: the requirement document rules them out, because they
        # need the user's provider to be a supported institution and in Australia
        # that is effectively nobody.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.edu.sydney.elec5620.kairo${KAIRO_BUNDLE_SUFFIX}
        # Per-developer, from mobile/signing.env. Empty is fine for the simulator;
        # a device build needs a real team. Setting it here rather than in Xcode's
        # UI is what makes it survive the next `generate.sh`.
        DEVELOPMENT_TEAM: ${KAIRO_DEV_TEAM}
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"

  KairoWatch:
    type: application
    platform: watchOS
    # XcodeGen only emits a scheme for a target that asks for one. Without this
    # the watch app built and embedded correctly — it is in
    # KairoApp.app/Watch/KairoWatch.app — and was still impossible to select,
    # run or debug on its own, because Xcode's scheme list had no entry for it.
    # "It is in the bundle" and "you can run it" are different claims.
    scheme: {}
    sources:
      - path: watch/KairoWatch
    dependencies:
      - package: Kairo
        product: KairoKit
    info:
      path: watch/KairoWatch/Info.plist
      properties:
        CFBundleDisplayName: Kairo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: au.edu.sydney.elec5620.kairo${KAIRO_BUNDLE_SUFFIX}
        NSHealthShareUsageDescription: >-
          Kairo reads your movement and heart data on the watch to notice when you
          have been sitting too long.
    entitlements:
      path: watch/KairoWatch/KairoWatch.entitlements
      properties:
        # The watch had NSHealthShareUsageDescription but no entitlement, so it
        # could not have read a sensor even with the code for it. Movement and
        # stand data are recorded on this device; reading them here is what lets
        # the sitting page show a real number instead of a zero.
        #
        # As on the phone, no healthkit.access key — see the note above.
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.edu.sydney.elec5620.kairo${KAIRO_BUNDLE_SUFFIX}.watchkitapp
        DEVELOPMENT_TEAM: ${KAIRO_DEV_TEAM}
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  KairoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/KairoUITests
    dependencies:
      - target: KairoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.edu.sydney.elec5620.kairo${KAIRO_BUNDLE_SUFFIX}.uitests
        DEVELOPMENT_TEAM: ${KAIRO_DEV_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: KairoApp
        GENERATE_INFOPLIST_FILE: YES
